
<style>
*{box-sizing:border-box;margin:0;padding:0;}

#gp-root{
  border-radius:var(--border-radius-lg);overflow:hidden;position:relative;
  display:flex;flex-direction:column;align-items:center;
  padding:1.5rem 1.5rem 1.25rem;font-family:var(--font-sans);
  transition:background 0.6s ease;
}
#gp-root.dark-mode{background:#0e0c10;}
#gp-root.light-mode{background:#f5f0ec;}

#bg-wash{position:absolute;inset:0;transition:background 2.2s ease;pointer-events:none;border-radius:var(--border-radius-lg);}

/* mode toggle */
#mode-toggle{position:absolute;top:14px;right:14px;z-index:10;background:none;border:0.5px solid rgba(255,255,255,0.18);border-radius:20px;cursor:pointer;padding:5px 12px;font-family:var(--font-sans);font-size:10px;letter-spacing:0.5px;color:rgba(255,255,255,0.55);transition:background 0.2s,color 0.2s,border-color 0.2s;}
#gp-root.light-mode #mode-toggle{border-color:rgba(0,0,0,0.15);color:rgba(0,0,0,0.45);}
#mode-toggle:hover{background:rgba(128,128,128,0.12);}

/* brand */
#brand{position:relative;z-index:2;text-align:center;margin-bottom:0.85rem;}
.logo-mark{font-size:17px;letter-spacing:7px;font-weight:400;margin-bottom:1px;transition:color 0.4s;}
.tagline{font-size:8.5px;letter-spacing:3.5px;text-transform:uppercase;transition:color 0.4s;}
.dark-mode .logo-mark{color:rgba(255,255,255,0.86);}
.dark-mode .tagline{color:rgba(255,255,255,0.27);}
.light-mode .logo-mark{color:rgba(40,30,20,0.88);}
.light-mode .tagline{color:rgba(40,30,20,0.38);}

/* day banner */
#day-banner{position:relative;z-index:2;width:100%;max-width:360px;border-radius:12px;padding:8px 13px;margin-bottom:0.85rem;display:flex;align-items:center;gap:10px;transition:background 0.4s,border-color 0.4s;}
.dark-mode #day-banner{background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);}
.light-mode #day-banner{background:rgba(255,255,255,0.55);border:0.5px solid rgba(0,0,0,0.08);}
#day-dot{width:26px;height:26px;border-radius:50%;flex-shrink:0;transition:background 1s;}
#day-date{font-size:8.5px;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px;transition:color 0.4s;}
#day-reason{font-size:11px;line-height:1.45;transition:color 0.4s;}
.dark-mode #day-date{color:rgba(255,255,255,0.28);}
.dark-mode #day-reason{color:rgba(255,255,255,0.7);}
.light-mode #day-date{color:rgba(40,30,20,0.38);}
.light-mode #day-reason{color:rgba(40,30,20,0.75);}

/* pod */
#pod-wrap{position:relative;z-index:2;margin-bottom:0.9rem;display:flex;flex-direction:column;align-items:center;}
#pod-glow{width:136px;height:136px;border-radius:50%;cursor:pointer;position:relative;}
#pod-base{width:76px;height:12px;border-radius:0 0 36px 36px;margin:-2px auto 0;transition:background 0.4s;}
.dark-mode #pod-base{background:rgba(255,255,255,0.07);}
.light-mode #pod-base{background:rgba(0,0,0,0.08);}

/* breathing rings — pure CSS, no JS needed */
.ring{position:absolute;top:50%;left:50%;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;}
#ring1{width:136px;height:136px;border:1.5px solid transparent;animation:breatheRing1 5s ease-in-out infinite;}
#ring2{width:136px;height:136px;border:1px solid transparent;animation:breatheRing2 5s ease-in-out infinite 1s;}
#ring3{width:136px;height:136px;border:0.5px solid transparent;animation:breatheRing3 5s ease-in-out infinite 2s;}
@keyframes breatheRing1{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.35;}50%{transform:translate(-50%,-50%) scale(1.55);opacity:0;}}
@keyframes breatheRing2{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.22;}50%{transform:translate(-50%,-50%) scale(1.9);opacity:0;}}
@keyframes breatheRing3{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.12;}50%{transform:translate(-50%,-50%) scale(2.3);opacity:0;}}

/* pod inner glow breathe */
#pod-glow-inner{position:absolute;inset:0;border-radius:50%;animation:podBreath 5s ease-in-out infinite;pointer-events:none;}
@keyframes podBreath{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.88;transform:scale(1.035);}}

/* color label */
#color-label{position:relative;z-index:2;text-align:center;margin-bottom:0.35rem;}
#color-name{font-size:18px;font-weight:400;letter-spacing:0.5px;margin-bottom:2px;transition:color 0.4s;}
#color-story-line{font-size:11.5px;max-width:260px;line-height:1.6;font-style:italic;transition:color 0.4s;}
.dark-mode #color-name{color:rgba(255,255,255,0.88);}
.dark-mode #color-story-line{color:rgba(255,255,255,0.38);}
.light-mode #color-name{color:rgba(40,30,20,0.88);}
.light-mode #color-story-line{color:rgba(40,30,20,0.5);}

/* prompt */
#prompt-card{position:relative;z-index:2;border-radius:var(--border-radius-lg);padding:0.7rem 1rem;max-width:310px;width:100%;margin:0.5rem 0 0.35rem;text-align:center;transition:background 0.4s,border-color 0.4s;}
.dark-mode #prompt-card{background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.09);}
.light-mode #prompt-card{background:rgba(255,255,255,0.6);border:0.5px solid rgba(0,0,0,0.07);}
#prompt-label{font-size:8.5px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;transition:color 0.4s;}
#prompt-text{font-size:13px;line-height:1.6;min-height:36px;display:flex;align-items:center;justify-content:center;transition:color 0.4s;}
.dark-mode #prompt-label{color:rgba(255,255,255,0.25);}
.dark-mode #prompt-text{color:rgba(255,255,255,0.75);}
.light-mode #prompt-label{color:rgba(40,30,20,0.35);}
.light-mode #prompt-text{color:rgba(40,30,20,0.78);}

/* tabs */
#tabs{position:relative;z-index:2;display:flex;gap:3px;border-radius:40px;padding:3px;margin:0.5rem 0 0.15rem;transition:background 0.4s,border-color 0.4s;}
.dark-mode #tabs{background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.08);}
.light-mode #tabs{background:rgba(0,0,0,0.05);border:0.5px solid rgba(0,0,0,0.07);}
.tab-btn{background:none;border:none;font-size:10.5px;padding:5px 11px;border-radius:40px;cursor:pointer;font-family:var(--font-sans);letter-spacing:0.4px;transition:background 0.2s,color 0.2s;}
.dark-mode .tab-btn{color:rgba(255,255,255,0.4);}
.dark-mode .tab-btn.active{background:rgba(255,255,255,0.13);color:rgba(255,255,255,0.9);}
.light-mode .tab-btn{color:rgba(40,30,20,0.45);}
.light-mode .tab-btn.active{background:rgba(255,255,255,0.8);color:rgba(40,30,20,0.9);}

/* panel */
#panel{position:relative;z-index:2;width:100%;max-width:360px;}
#panel-colors,#panel-picker,#panel-journal,#panel-calendar{display:none;}
#panel-colors.show,#panel-picker.show,#panel-journal.show,#panel-calendar.show{display:block;}

/* swatches */
#swatch-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:0.5rem 0;}
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color 0.2s,transform 0.15s;position:relative;}
.swatch:hover{transform:scale(1.2);}
.swatch.selected{border-color:rgba(255,255,255,0.75);}
.light-mode .swatch.selected{border-color:rgba(0,0,0,0.4);}
.sw-tip{position:absolute;bottom:calc(100%+7px);left:50%;transform:translateX(-50%);border:0.5px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.78);font-size:10px;white-space:nowrap;padding:4px 10px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity 0.15s;z-index:30;background:rgba(10,8,14,0.88);}
.swatch:hover .sw-tip{opacity:1;}

/* picker */
#picker-area{padding:0.4rem 0;}
#spectrum-wrap{position:relative;border-radius:10px;overflow:hidden;cursor:crosshair;margin-bottom:7px;}
#spectrum-canvas{display:block;width:100%;height:120px;border-radius:10px;}
#spec-cursor{position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,0.4);pointer-events:none;transform:translate(-50%,-50%);top:50%;left:50%;}
#hue-wrap{position:relative;margin-bottom:9px;}
#hue-canvas{display:block;width:100%;height:15px;border-radius:7px;cursor:pointer;}
#hue-cursor{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,0.35);pointer-events:none;transform:translate(-50%,-50%);}
#picker-preview{display:flex;align-items:center;gap:10px;margin-top:7px;}
#picked-swatch{width:38px;height:38px;border-radius:50%;border:2px solid rgba(128,128,128,0.25);flex-shrink:0;transition:background 0.3s;}
#picker-info{flex:1;}
.pk-input{border-radius:6px;font-size:11px;padding:4px 8px;font-family:var(--font-sans);margin-bottom:4px;display:block;width:100%;transition:background 0.3s,border-color 0.3s,color 0.3s;}
.dark-mode .pk-input{background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.14);color:rgba(255,255,255,0.75);}
.light-mode .pk-input{background:rgba(255,255,255,0.7);border:0.5px solid rgba(0,0,0,0.12);color:rgba(40,30,20,0.8);}
#picked-hex-input{width:88px!important;}
#picker-btns{display:flex;gap:5px;flex-wrap:wrap;}
.pk-btn{border-radius:20px;font-size:10.5px;padding:5px 11px;cursor:pointer;font-family:var(--font-sans);transition:background 0.2s;}
.dark-mode .pk-btn{background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.14);color:rgba(255,255,255,0.65);}
.dark-mode .pk-btn:hover{background:rgba(255,255,255,0.13);}
.light-mode .pk-btn{background:rgba(255,255,255,0.6);border:0.5px solid rgba(0,0,0,0.1);color:rgba(40,30,20,0.65);}
.light-mode .pk-btn:hover{background:rgba(255,255,255,0.9);}
#picker-saved{display:none;flex-direction:column;align-items:center;text-align:center;padding:1rem 0.5rem;gap:7px;}
#picker-saved-dot{width:48px;height:48px;border-radius:50%;border:2px solid rgba(128,128,128,0.2);margin:0 auto;}
#picker-saved-name{font-size:13px;letter-spacing:0.5px;transition:color 0.3s;}
.dark-mode #picker-saved-name{color:rgba(255,255,255,0.75);}
.light-mode #picker-saved-name{color:rgba(40,30,20,0.75);}
#picker-saved-sub{font-size:10.5px;font-style:italic;transition:color 0.3s;}
.dark-mode #picker-saved-sub{color:rgba(255,255,255,0.3);}
.light-mode #picker-saved-sub{color:rgba(40,30,20,0.35);}
#picker-reset{background:none;border-radius:20px;font-size:10.5px;padding:5px 13px;cursor:pointer;font-family:var(--font-sans);margin-top:3px;transition:color 0.2s,border-color 0.2s;}
.dark-mode #picker-reset{border:0.5px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.35);}
.dark-mode #picker-reset:hover{color:rgba(255,255,255,0.62);}
.light-mode #picker-reset{border:0.5px solid rgba(0,0,0,0.1);color:rgba(40,30,20,0.4);}
.light-mode #picker-reset:hover{color:rgba(40,30,20,0.7);}

/* journal */
#journal-area{padding:0.35rem 0;}
#fav-list{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow-y:auto;padding-right:3px;}
#fav-list::-webkit-scrollbar{width:3px;}
#fav-list::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.2);border-radius:3px;}
.fav-item{border-radius:10px;padding:7px 8px;display:flex;align-items:flex-start;gap:8px;transition:background 0.3s,border-color 0.3s;}
.dark-mode .fav-item{background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.08);}
.light-mode .fav-item{background:rgba(255,255,255,0.55);border:0.5px solid rgba(0,0,0,0.07);}
.fav-dot{width:30px;height:30px;border-radius:50%;flex-shrink:0;cursor:pointer;transition:transform 0.15s;margin-top:1px;}
.fav-dot:hover{transform:scale(1.1);}
.fav-body{flex:1;min-width:0;}
.fav-name{font-size:11px;font-weight:500;margin-bottom:1px;transition:color 0.3s;}
.fav-note{font-size:10.5px;line-height:1.5;font-style:italic;word-break:break-word;transition:color 0.3s;}
.dark-mode .fav-name{color:rgba(255,255,255,0.8);}
.dark-mode .fav-note{color:rgba(255,255,255,0.38);}
.light-mode .fav-name{color:rgba(40,30,20,0.82);}
.light-mode .fav-note{color:rgba(40,30,20,0.45);}
.fav-del{background:none;border:none;font-size:13px;cursor:pointer;padding:1px 3px;align-self:flex-start;flex-shrink:0;transition:color 0.2s;}
.dark-mode .fav-del{color:rgba(255,255,255,0.18);}
.dark-mode .fav-del:hover{color:rgba(255,255,255,0.5);}
.light-mode .fav-del{color:rgba(0,0,0,0.18);}
.light-mode .fav-del:hover{color:rgba(0,0,0,0.5);}
#empty-fav{text-align:center;font-size:11.5px;padding:1.1rem;line-height:1.9;transition:color 0.3s;}
.dark-mode #empty-fav{color:rgba(255,255,255,0.26);}
.light-mode #empty-fav{color:rgba(40,30,20,0.35);}
#save-form{margin-top:8px;border-radius:10px;padding:8px 9px;transition:background 0.3s,border-color 0.3s;}
.dark-mode #save-form{background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.08);}
.light-mode #save-form{background:rgba(255,255,255,0.5);border:0.5px solid rgba(0,0,0,0.07);}
#save-form-label{font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;transition:color 0.3s;}
.dark-mode #save-form-label{color:rgba(255,255,255,0.26);}
.light-mode #save-form-label{color:rgba(40,30,20,0.35);}
#journal-input{width:100%;border-radius:7px;font-size:11.5px;padding:6px 8px;font-family:var(--font-sans);resize:none;height:52px;line-height:1.5;transition:background 0.3s,border-color 0.3s,color 0.3s;}
.dark-mode #journal-input{background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.72);}
.light-mode #journal-input{background:rgba(255,255,255,0.7);border:0.5px solid rgba(0,0,0,0.1);color:rgba(40,30,20,0.78);}
#save-btn{margin-top:5px;border-radius:20px;font-size:10.5px;padding:5px 16px;cursor:pointer;font-family:var(--font-sans);transition:background 0.2s;}
.dark-mode #save-btn{background:rgba(255,255,255,0.09);border:0.5px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.78);}
.dark-mode #save-btn:hover{background:rgba(255,255,255,0.16);}
.light-mode #save-btn{background:rgba(255,255,255,0.7);border:0.5px solid rgba(0,0,0,0.12);color:rgba(40,30,20,0.75);}
.light-mode #save-btn:hover{background:rgba(255,255,255,0.95);}

/* calendar */
#cal-wrap{padding:0.4rem 0;}
#cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
#cal-month-label{font-size:12px;letter-spacing:0.5px;transition:color 0.3s;}
.dark-mode #cal-month-label{color:rgba(255,255,255,0.68);}
.light-mode #cal-month-label{color:rgba(40,30,20,0.72);}
.cal-nav{background:none;border-radius:20px;font-size:11px;padding:3px 10px;cursor:pointer;font-family:var(--font-sans);transition:color 0.2s;}
.dark-mode .cal-nav{border:0.5px solid rgba(255,255,255,0.11);color:rgba(255,255,255,0.42);}
.dark-mode .cal-nav:hover{color:rgba(255,255,255,0.72);}
.light-mode .cal-nav{border:0.5px solid rgba(0,0,0,0.1);color:rgba(40,30,20,0.45);}
.light-mode .cal-nav:hover{color:rgba(40,30,20,0.8);}
#cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{font-size:9px;text-align:center;padding:2px 0;letter-spacing:0.5px;transition:color 0.3s;}
.dark-mode .cal-dow{color:rgba(255,255,255,0.23);}
.light-mode .cal-dow{color:rgba(40,30,20,0.3);}
.cal-day{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:default;position:relative;transition:transform 0.15s,color 0.3s;}
.dark-mode .cal-day{color:rgba(255,255,255,0.3);}
.light-mode .cal-day{color:rgba(40,30,20,0.3);}
.cal-day.has-entry{cursor:pointer;}
.dark-mode .cal-day.has-entry{color:rgba(255,255,255,0.85);}
.light-mode .cal-day.has-entry{color:rgba(40,30,20,0.82);}
.cal-day.has-entry:hover{transform:scale(1.15);}
.cal-day.today{border:0.5px solid rgba(128,128,128,0.3);}
.cal-dot{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;}
#cal-detail{margin-top:8px;border-radius:10px;padding:8px 10px;display:none;transition:background 0.3s,border-color 0.3s;}
.dark-mode #cal-detail{background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.08);}
.light-mode #cal-detail{background:rgba(255,255,255,0.55);border:0.5px solid rgba(0,0,0,0.07);}
#cal-detail.show{display:block;}
#cal-detail-header{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
#cal-detail-dot{width:24px;height:24px;border-radius:50%;flex-shrink:0;}
#cal-detail-name{font-size:12px;font-weight:500;transition:color 0.3s;}
#cal-detail-date{font-size:10px;transition:color 0.3s;}
#cal-detail-note{font-size:11px;font-style:italic;line-height:1.55;transition:color 0.3s;}
.dark-mode #cal-detail-name{color:rgba(255,255,255,0.78);}
.dark-mode #cal-detail-date{color:rgba(255,255,255,0.3);}
.dark-mode #cal-detail-note{color:rgba(255,255,255,0.45);}
.light-mode #cal-detail-name{color:rgba(40,30,20,0.82);}
.light-mode #cal-detail-date{color:rgba(40,30,20,0.38);}
.light-mode #cal-detail-note{color:rgba(40,30,20,0.52);}

/* audio */
#audio-bar{position:relative;z-index:2;width:100%;max-width:360px;margin-top:0.5rem;}
#audio-card{border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px;transition:background 0.4s,border-color 0.4s;}
.dark-mode #audio-card{background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);}
.light-mode #audio-card{background:rgba(255,255,255,0.6);border:0.5px solid rgba(0,0,0,0.08);}
#audio-play{width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.2s;}
.dark-mode #audio-play{border:0.5px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.07);}
.dark-mode #audio-play:hover{background:rgba(255,255,255,0.15);}
.light-mode #audio-play{border:0.5px solid rgba(0,0,0,0.12);background:rgba(0,0,0,0.05);}
.light-mode #audio-play:hover{background:rgba(0,0,0,0.1);}
#audio-play svg{width:11px;height:11px;}
.dark-mode #audio-play svg{fill:rgba(255,255,255,0.72);}
.light-mode #audio-play svg{fill:rgba(40,30,20,0.65);}
#audio-info{flex:1;min-width:0;}
#audio-title{font-size:11px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 0.3s;}
#audio-sub{font-size:9.5px;letter-spacing:0.3px;transition:color 0.3s;}
.dark-mode #audio-title{color:rgba(255,255,255,0.7);}
.dark-mode #audio-sub{color:rgba(255,255,255,0.27);}
.light-mode #audio-title{color:rgba(40,30,20,0.72);}
.light-mode #audio-sub{color:rgba(40,30,20,0.35);}
#audio-progress-wrap{width:100%;height:2px;border-radius:1px;margin-top:4px;cursor:pointer;transition:background 0.3s;}
.dark-mode #audio-progress-wrap{background:rgba(255,255,255,0.1);}
.light-mode #audio-progress-wrap{background:rgba(0,0,0,0.08);}
#audio-progress{height:2px;border-radius:1px;background:rgba(180,120,80,0.7);width:0%;transition:width 0.3s;}
#audio-status{font-size:9px;transition:color 0.3s;}
.dark-mode #audio-status{color:rgba(255,255,255,0.2);}
.light-mode #audio-status{color:rgba(40,30,20,0.28);}

/* bottom row */
#bottom-row{position:relative;z-index:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:0.6rem;}
.ctrl-btn{border-radius:40px;font-size:10.5px;padding:5px 13px;cursor:pointer;font-family:var(--font-sans);transition:background 0.2s,color 0.2s;position:relative;}
.dark-mode .ctrl-btn{background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.11);color:rgba(255,255,255,0.55);}
.dark-mode .ctrl-btn:hover{background:rgba(255,255,255,0.11);}
.dark-mode .ctrl-btn.active{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.26);color:#fff;}
.light-mode .ctrl-btn{background:rgba(255,255,255,0.55);border:0.5px solid rgba(0,0,0,0.1);color:rgba(40,30,20,0.55);}
.light-mode .ctrl-btn:hover{background:rgba(255,255,255,0.85);}
.light-mode .ctrl-btn.active{background:rgba(255,255,255,0.9);border-color:rgba(0,0,0,0.2);color:rgba(40,30,20,0.88);}
.ctrl-tip{position:absolute;bottom:calc(100%+8px);left:50%;transform:translateX(-50%);background:rgba(10,8,14,0.88);border:0.5px solid rgba(255,255,255,0.11);color:rgba(255,255,255,0.7);font-size:9.5px;white-space:nowrap;padding:4px 10px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity 0.15s;z-index:30;}
.ctrl-btn:hover .ctrl-tip{opacity:1;}

#breathing-hint{position:relative;z-index:2;margin-top:0.3rem;font-size:9.5px;letter-spacing:1px;min-height:12px;transition:color 0.3s;}
.dark-mode #breathing-hint{color:rgba(255,255,255,0.18);}
.light-mode #breathing-hint{color:rgba(40,30,20,0.3);}

/* onboarding */
#onboard-overlay{position:absolute;inset:0;z-index:100;border-radius:var(--border-radius-lg);pointer-events:none;}
#onboard-overlay.active{pointer-events:all;}
#onboard-scrim{position:absolute;inset:0;background:rgba(6,4,10,0.76);border-radius:var(--border-radius-lg);opacity:0;transition:opacity 0.5s ease;}
#onboard-overlay.active #onboard-scrim{opacity:1;}
.onboard-card{position:absolute;display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.15);border-radius:16px;padding:15px 17px 12px;max-width:185px;text-align:center;opacity:0;transform:translateY(8px);transition:opacity 0.45s ease,transform 0.45s ease;pointer-events:none;}
.onboard-card.visible{opacity:1;transform:translateY(0);pointer-events:all;}
.onboard-icon{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.13);display:flex;align-items:center;justify-content:center;margin-bottom:7px;font-size:12px;}
.onboard-title{font-size:11px;font-weight:500;color:rgba(255,255,255,0.88);margin-bottom:3px;}
.onboard-body{font-size:10px;color:rgba(255,255,255,0.44);line-height:1.58;}
.onboard-dot-el{position:absolute;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.88);transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity 0.3s ease 0.2s;box-shadow:0 0 0 0 rgba(255,255,255,0.35);}
.onboard-dot-el.visible{opacity:1;animation:dotPulse 2s ease-out infinite;}
@keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,0.3);}70%{box-shadow:0 0 0 8px rgba(255,255,255,0);}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}}
#onboard-next{margin-top:9px;background:rgba(255,255,255,0.09);border:0.5px solid rgba(255,255,255,0.18);border-radius:20px;color:rgba(255,255,255,0.72);font-size:10px;padding:5px 13px;cursor:pointer;font-family:var(--font-sans);transition:background 0.2s;}
#onboard-next:hover{background:rgba(255,255,255,0.17);}
#onboard-skip{position:absolute;bottom:13px;right:13px;background:none;border:none;color:rgba(255,255,255,0.22);font-size:9.5px;cursor:pointer;font-family:var(--font-sans);pointer-events:all;transition:color 0.2s;}
#onboard-skip:hover{color:rgba(255,255,255,0.5);}
#onboard-step-dots{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:4px;pointer-events:none;}
.step-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,0.18);transition:background 0.3s;}
.step-dot.on{background:rgba(255,255,255,0.6);}
</style>

<div id="gp-root" class="dark-mode">
  <div id="bg-wash"></div>
  <div id="onboard-overlay"><div id="onboard-scrim"></div><div id="onboard-skip" onclick="dismissOnboard()">skip</div><div id="onboard-step-dots"></div></div>

  <div id="audio-bar">

        <svg id="icon-play" viewBox="0 0 10 12"><polygon points="0,0 10,6 0,12"/></svg>
        <svg id="icon-pause" viewBox="0 0 10 12" style="display:none"><rect x="0" y="0" width="3.5" height="12"/><rect x="6.5" y="0" width="3.5" height="12"/></svg>
      </div>
      <div id="audio-info">
        <div id="audio-title">Color story — Amber Skies</div>

  <div id="bottom-row">

    <button class="ctrl-btn" id="btn-breathe" onclick="setMode('breathe',this)">Breathe<span class="ctrl-tip">Let the pod pace your breathing</span></button>
    <button class="ctrl-btn" id="btn-explore" onclick="setMode('explore',this)">Explore<span class="ctrl-tip">Color &amp; mood pairings</span></button>
    <button class="ctrl-btn" onclick="nextColor()">Next<span class="ctrl-tip">Cycle to the next color</span></button>
  </div>
  <div id="breathing-hint"></div>
</div>

<script>
const COLORS=[
  {name:"Amber Skies",hex:"#FFBF00",
   story:"Fossilized resin that holds time itself — amber has glowed for tens of millions of years.",
   prompts:["Write about something you want to preserve forever.","Recall a memory that feels warm but distant.","Imagine a future archaeologist discovering your life.","What feels golden in your life right now?","What are you afraid of losing to time?"],
   bg:"radial-gradient(ellipse at 42% 28%, #3a2800, #180f00)"},
  {name:"Horizon Blue",hex:"#4A90E2",
   story:"The sky is blue because shorter wavelengths scatter more easily — always just out of reach.",
   prompts:["Write about something just beyond your grasp.","List 5 things you're moving toward.","Imagine a place where the sky never changes.","What are you chasing that keeps shifting?","Sit quietly and notice the farthest thing you can see."],
   bg:"radial-gradient(ellipse at 48% 22%, #081428, #020810)"},
  {name:"Deep Moss",hex:"#556B2F",
   story:"Moss thrives without roots, absorbing moisture from the air — patience and quiet resilience.",
   prompts:["Write about a time you grew slowly but steadily.","Spend 2 minutes noticing small details around you.","Reflect on where you feel most grounded.","What are you nurturing without rushing?","What in your life is ancient and still alive?"],
   bg:"radial-gradient(ellipse at 44% 26%, #0e1808, #060e04)"},
  {name:"Dawn Blush",hex:"#F4A6A6",
   story:"Pink skies at dawn occur because sunlight travels further through the atmosphere — long associated with tenderness and renewal.",
   prompts:["Write a beginning: a first line of a new story.","Think of a moment that felt like a fresh start.","Imagine what tomorrow could gently become.","What softness have you been keeping from yourself?","What are you ready to begin?"],
   bg:"radial-gradient(ellipse at 46% 28%, #2e0e0e, #140606)"},
  {name:"Soft Ember",hex:"#FF6F3C",
   story:"An ember glows not from flame but from residual heat — a quieter fire that sustains rather than consumes.",
   prompts:["Write about something still alive in you.","Reflect on a passion that hasn't gone out.","Imagine a slow-burning idea becoming real.","What are you still holding warmth for?","Who deserves a little of this light from you today?"],
   bg:"radial-gradient(ellipse at 42% 24%, #2e0e06, #130500)"},
  {name:"Velvet Indigo",hex:"#3F3D56",
   story:"Indigo was once called blue gold — traded across continents, shaping economies. The color of intuition and depth.",
   prompts:["Write about something you don't fully understand yet.","List questions you are currently holding.","Imagine a dream you haven't had yet.","What truth keeps finding its way back to you?","Sit in low light and notice your thoughts."],
   bg:"radial-gradient(ellipse at 50% 22%, #0c0c18, #060608)"},
  {name:"Sunlit Ochre",hex:"#CC7722",
   story:"Ochre is one of the oldest pigments — found in cave paintings over 40,000 years old. A direct line to the first humans.",
   prompts:["Write about something ancient in your life.","Think about what humans have always needed.","Make a mark, then respond to it.","What do you create that will outlast you?","Draw with your non-dominant hand and notice what happens."],
   bg:"radial-gradient(ellipse at 44% 26%, #281408, #100800)"},
  {name:"Sea Glass Green",hex:"#7ED9C4",
   story:"Sea glass begins as broken shards, smoothed over years by waves and sand until sharp becomes gentle.",
   prompts:["Write about something that softened you.","Reflect on change that took a long time.","Imagine what you're still becoming.","What has time transformed in you?","Hold something and notice its texture."],
   bg:"radial-gradient(ellipse at 52% 22%, #081c18, #030e0a)"},
  {name:"Lunar Silver",hex:"#C0C0C0",
   story:"The Moon reflects, never produces its own light. Its silvery glow has guided travelers and shaped calendars across time.",
   prompts:["Write about something you reflect rather than create.","List what illuminates you.","Imagine seeing your life from far away.","What guides you without shining directly on you?","Sit in quiet and notice subtle shifts."],
   bg:"radial-gradient(ellipse at 50% 24%, #141414, #080808)"},
  {name:"Electric Orchid",hex:"#DA70D6",
   story:"Magenta tones like orchid don't exist in the visible spectrum — they are created entirely by the brain blending red and blue.",
   prompts:["Create something that feels unusual or bold.","Write about a version of yourself you don't show often.","Combine two unrelated ideas into one.","Take a creative risk, even a small one.","What do you imagine that others can't quite see?"],
   bg:"radial-gradient(ellipse at 48% 26%, #200820, #0c040c)"},
];

const EXPLORE=["Amber Skies before writing something you want to last.","Horizon Blue when you're chasing something just out of reach.","Deep Moss for slow mornings and patient work.","Dawn Blush when you need to begin again.","Soft Ember for the passion that never quite goes out.","Velvet Indigo for sitting with unanswerable questions.","Sunlit Ochre to connect with something ancient in yourself.","Sea Glass Green when you're ready to let time do its work.","Lunar Silver when you need to reflect rather than act.","Electric Orchid to unlock the version of you that surprises."];

const now=new Date();
const MD=`${now.getMonth()+1}-${now.getDate()}`;
const FEATURED_DAYS={
  "4-22":{idx:2,reason:"Earth Day — Deep Moss, for the quiet patience of living things."},
  "4-30":{idx:0,reason:"End of April — Amber Skies, to preserve what this month held."},
  "5-1":{idx:7,reason:"May Day — Sea Glass Green, for renewal shaped by time."},
  "6-21":{idx:0,reason:"Summer Solstice — Amber Skies, the longest, warmest light."},
  "10-31":{idx:5,reason:"Halloween — Velvet Indigo, for questions that live in the dark."},
  "12-21":{idx:8,reason:"Winter Solstice — Lunar Silver, the longest night's reflection."},
  "2-14":{idx:4,reason:"Valentine's Day — Soft Ember, the warmth that doesn't consume."},
  "1-1":{idx:3,reason:"New Year — Dawn Blush, for everything beginning again."},
  "11-11":{idx:8,reason:"Remembrance Day — Lunar Silver, for light reflected from far away."},
};
const featuredDay=FEATURED_DAYS[MD];
const featuredIdx=featuredDay?featuredDay.idx:Math.floor(now.getDate()*7%COLORS.length);

let current=featuredIdx,mode='reflect',breatheInterval=null,pickedHex='#FFBF00',pickedHue=0,specX=0.5,specY=0.5;
let favorites=[];try{favorites=JSON.parse(localStorage.getItem('gp_favs2')||'[]');}catch(e){}
let pickerSaved=false,isDark=true;
let calYear=now.getFullYear(),calMonth=now.getMonth();
let audioState={playing:false,timer:null,elapsed:0,total:0};

const root=document.getElementById('gp-root');
const pod=document.getElementById('pod-glow');
const podInner=document.getElementById('pod-glow-inner');
const bgWash=document.getElementById('bg-wash');
const colorNameEl=document.getElementById('color-name');
const colorStoryEl=document.getElementById('color-story-line');
const promptTextEl=document.getElementById('prompt-text');
const breathingHint=document.getElementById('breathing-hint');
const pickedSwatch=document.getElementById('picked-swatch');
const pickedHexInput=document.getElementById('picked-hex-input');
const specCursor=document.getElementById('spec-cursor');

function toggleMode(){
  isDark=!isDark;
  root.className=isDark?'dark-mode':'light-mode';
  document.getElementById('mode-toggle').textContent=isDark?'Light mode':'Dark mode';
  applyColor(true);
}

function hexToRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function hsvToRgb(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}return[Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];}
function hexToHsv(hex){let[r,g,b]=hexToRgb(hex);r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0,s=max===0?0:d/max,v=max;if(d){if(max===r)h=((g-b)/d+6)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}return[h,s,v];}
function darken(hex,f){const[r,g,b]=hexToRgb(hex);return rgbToHex(r*f,g*f,b*f);}
function lighten(hex,f){const[r,g,b]=hexToRgb(hex);return rgbToHex(r+(255-r)*f,g+(255-g)*f,b+(255-b)*f);}
function hexToBgLight(hex){const l=lighten(hex,0.72),ll=lighten(hex,0.88);return`radial-gradient(ellipse at 45% 30%, ${l}, ${ll})`;}

function pickPrompt(){if(current<0)return'What does this color stir in you?';const a=COLORS[current].prompts;return a[Math.floor(Math.random()*a.length)];}

function updateRingColors(hex){
  const r1=document.getElementById('ring1'),r2=document.getElementById('ring2'),r3=document.getElementById('ring3');
  const a=isDark?'rgba':'rgba';
  r1.style.borderColor=hex+'66';
  r2.style.borderColor=hex+'44';
  r3.style.borderColor=hex+'28';
}

function applyColor(instant,useHex){
  const hex=useHex||(current>=0?COLORS[current].hex:pickedHex);
  const glow=darken(hex,0.62);
  const dur=instant?'0s':'1.8s';
  pod.style.transition=`background ${dur} ease,box-shadow ${dur} ease`;
  bgWash.style.transition=`background ${dur} ease`;

  if(isDark){
    pod.style.background=`radial-gradient(circle at 36% 36%, #ffffffcc, ${hex} 42%, ${glow})`;
    pod.style.boxShadow=`0 0 48px 14px ${hex}55,0 0 96px 28px ${glow}30`;
    bgWash.style.background=current>=0&&!useHex?COLORS[current].bg:`radial-gradient(ellipse at 45% 25%, ${darken(hex,0.18)}, ${darken(hex,0.08)})`;
  } else {
    pod.style.background=`radial-gradient(circle at 36% 36%, #ffffffee, ${lighten(hex,0.25)} 42%, ${hex})`;
    pod.style.boxShadow=`0 0 36px 10px ${hex}40,0 0 72px 22px ${hex}22`;
    bgWash.style.background=current>=0&&!useHex?hexToBgLight(COLORS[current].hex):hexToBgLight(hex);
  }

  updateRingColors(hex);

  if(!useHex){
    const nm=current>=0?COLORS[current].name:'Custom';
    colorNameEl.textContent=nm;
    colorStoryEl.textContent=current>=0?COLORS[current].story:'Your own hue, your own moment.';
    if(mode==='reflect')promptTextEl.textContent=pickPrompt();
    document.getElementById('audio-title').textContent=`Color story — ${nm}`;
    document.getElementById('day-dot').style.background=COLORS[featuredIdx].hex;
  }
  updateSwatches();
}

function setDayBanner(){
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('day-date').textContent=`${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
  document.getElementById('day-dot').style.background=COLORS[featuredIdx].hex;
  document.getElementById('day-reason').textContent=featuredDay?featuredDay.reason:`Today's color — ${COLORS[featuredIdx].name}.`;
}

function buildSwatches(){
  const row=document.getElementById('swatch-row');
  COLORS.forEach((c,i)=>{
    const s=document.createElement('div');
    s.className='swatch'+(i===featuredIdx?' selected':'');
    s.style.background=c.hex;
    const tip=document.createElement('span');tip.className='sw-tip';tip.textContent=c.name;
    s.appendChild(tip);
    s.onclick=()=>{current=i;pickedHex=c.hex;applyColor();updateSwatches();stopAudio();};
    row.appendChild(s);
  });
}
function updateSwatches(){document.querySelectorAll('.swatch').forEach((s,i)=>s.classList.toggle('selected',i===current));}
function nextColor(){current=(current+1)%COLORS.length;pickedHex=COLORS[current].hex;applyColor();stopAudio();}

function showTab(tab){
  ['colors','picker','journal','calendar'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===tab);
    document.getElementById('panel-'+t).classList.toggle('show',t===tab);
  });
  if(tab==='picker'&&!pickerSaved)setTimeout(()=>{drawSpectrum();drawHue();},60);
  if(tab==='journal')renderFavs();
  if(tab==='calendar')renderCalendar();
}

function setMode(m,btn){
  mode=m;
  document.querySelectorAll('.ctrl-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  clearTimeout(breatheInterval);breatheInterval=null;
  breathingHint.textContent='';pod.style.transform='scale(1)';
  if(m==='reflect'){promptTextEl.textContent=pickPrompt();}
  else if(m==='breathe'){
    const steps=['Breathe in…','Hold…','Breathe out…','Rest…'],durs=[4000,2000,6000,2000],scales=[1.08,1.1,0.96,1];
    let step=0;breathingHint.textContent='Follow the pod';promptTextEl.textContent=steps[0];
    pod.style.transition='transform 4s ease,background 2s ease,box-shadow 2s ease';pod.style.transform=`scale(${scales[0]})`;
    function nxt(){step=(step+1)%4;promptTextEl.textContent=steps[step];pod.style.transition=`transform ${durs[step]/1000}s ease,background 2s ease,box-shadow 2s ease`;pod.style.transform=`scale(${scales[step]})`;breatheInterval=setTimeout(nxt,durs[step]);}
    breatheInterval=setTimeout(nxt,durs[0]);
  } else if(m==='explore'){
    let ei=0;function cyc(){promptTextEl.textContent=EXPLORE[ei%EXPLORE.length];ei++;breatheInterval=setTimeout(cyc,4000);}cyc();
  }
}
pod.addEventListener('click',()=>{if(mode!=='breathe')setMode('breathe',document.getElementById('btn-breathe'));else nextColor();});

// Audio
function buildStory(){
  const c=COLORS[current>=0?current:0];
  return`Welcome to your Glow Pod color meditation. Today's color is ${c.name}. ${c.story}. Close your eyes and let this color fill the room around you. Breathe in for four counts, feeling this hue settle over your shoulders. Hold for two. And release slowly for six. Rest for two. As you breathe, hold this question gently: ${c.prompts[0]}. You don't need to answer it. Simply let it float in the color. Breathe in. Hold. Breathe out. Rest. ${c.name} is not just a color. It is a frequency your body already knows. Stay inside it for as long as you need. When you're ready, let your eyes open slowly. The light remains.`;
}
function toggleAudio(){audioState.playing?stopAudio():startAudio();}
function startAudio(){
  if(!window.speechSynthesis)return;
  stopAudio();
  const txt=buildStory();
  const u=new SpeechSynthesisUtterance(txt);
  u.rate=0.82;u.pitch=0.94;u.volume=1;
  const voices=speechSynthesis.getVoices();
  const pref=voices.find(v=>/samantha|karen|victoria|moira|fiona/i.test(v.name));
  if(pref)u.voice=pref;
  audioState.total=txt.split(' ').length*580;
  audioState.elapsed=0;
  u.onstart=()=>{
    audioState.playing=true;
    document.getElementById('icon-play').style.display='none';
    document.getElementById('icon-pause').style.display='block';
    document.getElementById('audio-sub').textContent='Now playing…';
    tickProg();
  };
  u.onend=()=>stopAudio(true);
  u.onerror=()=>{stopAudio();document.getElementById('audio-sub').textContent='Audio unavailable in this browser';};
  speechSynthesis.speak(u);
}
function tickProg(){
  if(!audioState.playing)return;
  audioState.elapsed+=300;
  const pct=Math.min(100,Math.round(audioState.elapsed/audioState.total*100));
  document.getElementById('audio-progress').style.width=pct+'%';
  const rem=Math.max(0,Math.round((audioState.total-audioState.elapsed)/1000));
  document.getElementById('audio-status').textContent=rem>0?`${rem}s remaining`:'';
  audioState.timer=setTimeout(tickProg,300);
}
function stopAudio(fin){
  if(window.speechSynthesis)speechSynthesis.cancel();
  clearTimeout(audioState.timer);audioState.playing=false;
  document.getElementById('icon-play').style.display='block';
  document.getElementById('icon-pause').style.display='none';
  document.getElementById('audio-sub').textContent=fin?'Complete — tap to replay':'Tap play to hear your meditation';
  if(!fin){document.getElementById('audio-progress').style.width='0%';document.getElementById('audio-status').textContent='';}
}
function seekAudio(e){if(!audioState.playing)return;const r=e.currentTarget.getBoundingClientRect();audioState.elapsed=(e.clientX-r.left)/r.width*audioState.total;}

// Eyedropper
let specCtx,hueCtx,specW=320,specH=120,hueW=320;
function drawSpectrum(){
  const c=document.getElementById('spectrum-canvas');if(!c)return;
  specW=c.offsetWidth||320;specH=120;c.width=specW*devicePixelRatio;c.height=specH*devicePixelRatio;
  specCtx=c.getContext('2d');specCtx.scale(devicePixelRatio,devicePixelRatio);
  const[r,g,b]=hsvToRgb(pickedHue,1,1),hc=`rgb(${r},${g},${b})`;
  const gh=specCtx.createLinearGradient(0,0,specW,0);gh.addColorStop(0,'#fff');gh.addColorStop(1,hc);
  specCtx.fillStyle=gh;specCtx.fillRect(0,0,specW,specH);
  const gv=specCtx.createLinearGradient(0,0,0,specH);gv.addColorStop(0,'rgba(0,0,0,0)');gv.addColorStop(1,'#000');
  specCtx.fillStyle=gv;specCtx.fillRect(0,0,specW,specH);
  specCursor.style.left=(specX*100)+'%';specCursor.style.top=(specY*100)+'%';
}
function drawHue(){
  const c=document.getElementById('hue-canvas');if(!c)return;
  hueW=c.offsetWidth||320;c.width=hueW*devicePixelRatio;c.height=15*devicePixelRatio;
  hueCtx=c.getContext('2d');hueCtx.scale(devicePixelRatio,devicePixelRatio);
  const g=hueCtx.createLinearGradient(0,0,hueW,0);
  for(let i=0;i<=360;i+=30){const[r,rb,rb2]=hsvToRgb(i,1,1);g.addColorStop(i/360,`rgb(${r},${rb},${rb2})`);}
  hueCtx.fillStyle=g;hueCtx.fillRect(0,0,hueW,15);
  document.getElementById('hue-cursor').style.left=(pickedHue/360*100)+'%';
}
function sampleSpec(x,y,w,h){
  specX=Math.max(0,Math.min(1,x/w));specY=Math.max(0,Math.min(1,y/h));
  const[r,g,b]=hsvToRgb(pickedHue,specX,1-specY);
  pickedHex=rgbToHex(r,g,b);pickedSwatch.style.background=pickedHex;pickedHexInput.value=pickedHex;
  specCursor.style.left=(specX*100)+'%';specCursor.style.top=(specY*100)+'%';
}
function sampleHue(x,w){
  pickedHue=Math.max(0,Math.min(360,(x/w)*360));drawHue();drawSpectrum();
  const[r,g,b]=hsvToRgb(pickedHue,specX,1-specY);
  pickedHex=rgbToHex(r,g,b);pickedSwatch.style.background=pickedHex;pickedHexInput.value=pickedHex;
}
function bindCanvas(el,fn){
  el.addEventListener('mousedown',e=>{const r=el.getBoundingClientRect();fn(e.clientX-r.left,e.clientY-r.top,r.width,r.height);});
  el.addEventListener('mousemove',e=>{if(e.buttons!==1)return;const r=el.getBoundingClientRect();fn(e.clientX-r.left,e.clientY-r.top,r.width,r.height);});
  el.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0],r=el.getBoundingClientRect();fn(t.clientX-r.left,t.clientY-r.top,r.width,r.height);},{passive:false});
  el.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0],r=el.getBoundingClientRect();fn(t.clientX-r.left,t.clientY-r.top,r.width,r.height);},{passive:false});
}
bindCanvas(document.getElementById('spectrum-wrap'),(x,y,w,h)=>sampleSpec(x,y,w,h));
bindCanvas(document.getElementById('hue-wrap'),(x,y,w)=>sampleHue(x,w));
pickedHexInput.addEventListener('input',e=>{
  if(/^#[0-9a-fA-F]{6}$/.test(e.target.value)){pickedHex=e.target.value;pickedSwatch.style.background=pickedHex;const[h]=hexToHsv(pickedHex);pickedHue=h;drawHue();drawSpectrum();}
});
function applyPickedColor(){
  const nm=document.getElementById('picker-name-input').value.trim()||'Custom';
  current=-1;colorNameEl.textContent=nm;colorStoryEl.textContent='Your own hue, your own moment.';
  if(mode==='reflect')promptTextEl.textContent='What does this color stir in you?';
  document.getElementById('audio-title').textContent=`Color story — ${nm}`;
  applyColor(false,pickedHex);
}
function savePickedAndCollapse(){
  const nm=document.getElementById('picker-name-input').value.trim()||pickedHex.toUpperCase();
  favorites.unshift({id:Date.now(),hex:pickedHex,name:nm,note:'',date:new Date().toLocaleDateString(),dateKey:toDateKey(now)});
  try{localStorage.setItem('gp_favs2',JSON.stringify(favorites));}catch(e){}
  applyPickedColor();pickerSaved=true;
  document.getElementById('picker-area').style.display='none';
  document.getElementById('picker-saved').style.display='flex';
  document.getElementById('picker-saved-dot').style.background=pickedHex;
  document.getElementById('picker-saved-name').textContent=nm;
  document.getElementById('picker-saved-sub').textContent='Saved. Add a note in the Journal tab.';
}
function resetPicker(){
  pickerSaved=false;
  document.getElementById('picker-area').style.display='block';
  document.getElementById('picker-saved').style.display='none';
  document.getElementById('picker-name-input').value='';
  setTimeout(()=>{drawSpectrum();drawHue();},60);
}

// Journal
function toDateKey(d){return`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;}
function saveFavorite(){
  const note=document.getElementById('journal-input').value.trim();
  const hex=current>=0?COLORS[current].hex:pickedHex;
  const name=current>=0?COLORS[current].name:colorNameEl.textContent;
  favorites.unshift({id:Date.now(),hex,name,note,date:new Date().toLocaleDateString(),dateKey:toDateKey(now)});
  try{localStorage.setItem('gp_favs2',JSON.stringify(favorites));}catch(e){}
  document.getElementById('journal-input').value='';renderFavs();
}
function deleteFav(id){favorites=favorites.filter(f=>f.id!==id);try{localStorage.setItem('gp_favs2',JSON.stringify(favorites));}catch(e){}renderFavs();}
function applyFav(hex,name){
  const idx=COLORS.findIndex(c=>c.hex===hex);
  if(idx>=0){current=idx;applyColor();}
  else{current=-1;pickedHex=hex;colorNameEl.textContent=name;colorStoryEl.textContent='Your own hue, your own moment.';applyColor(false,hex);}
  showTab('colors');
}
function renderFavs(){
  const list=document.getElementById('fav-list');
  if(!favorites.length){list.innerHTML='<div id="empty-fav">No saved colors yet.<br>Let a color find you — then keep it.</div>';return;}
  list.innerHTML=favorites.map(f=>`<div class="fav-item"><div class="fav-dot" style="background:${f.hex}" onclick="applyFav('${f.hex}','${f.name.replace(/'/g,"\\'")}')"></div><div class="fav-body"><div class="fav-name">${f.name} <span style="font-size:9px;opacity:0.35;font-weight:400">${f.date}</span></div><div class="fav-note">${f.note||'<span style="opacity:0.35">No note</span>'}</div></div><button class="fav-del" onclick="deleteFav(${f.id})">×</button></div>`).join('');
}

// Calendar
function renderCalendar(){
  const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-month-label').textContent=`${MONTHS[calMonth]} ${calYear}`;
  const grid=document.getElementById('cal-grid');grid.innerHTML='';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d=>{const el=document.createElement('div');el.className='cal-dow';el.textContent=d;grid.appendChild(el);});
  const first=new Date(calYear,calMonth,1).getDay();
  const daysIn=new Date(calYear,calMonth+1,0).getDate();
  for(let i=0;i<first;i++){const el=document.createElement('div');el.className='cal-day';grid.appendChild(el);}
  const eMap={};favorites.forEach(f=>{if(f.dateKey)eMap[f.dateKey]=f;});
  for(let d=1;d<=daysIn;d++){
    const key=`${calYear}-${calMonth+1}-${d}`;
    const entry=eMap[key];
    const isToday=d===now.getDate()&&calMonth===now.getMonth()&&calYear===now.getFullYear();
    const el=document.createElement('div');
    el.className='cal-day'+(isToday?' today':'')+(entry?' has-entry':'');
    el.textContent=d;
    if(entry){
      el.style.background=entry.hex+'2a';
      const dot=document.createElement('div');dot.className='cal-dot';dot.style.background=entry.hex;el.appendChild(dot);
      el.onclick=()=>showCalDetail(entry,d);
    }
    grid.appendChild(el);
  }
  document.getElementById('cal-detail').classList.remove('show');
}
function showCalDetail(entry,d){
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dd=document.getElementById('cal-detail-dot');
  dd.style.background=entry.hex;dd.style.width='24px';dd.style.height='24px';dd.style.borderRadius='50%';dd.style.flexShrink='0';
  document.getElementById('cal-detail-name').textContent=entry.name;
  document.getElementById('cal-detail-date').textContent=`${MONTHS[calMonth]} ${d}, ${calYear}`;
  document.getElementById('cal-detail-note').textContent=entry.note||'No note recorded.';
  document.getElementById('cal-detail').classList.add('show');
}
function calNav(dir){calMonth+=dir;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}renderCalendar();}

// Onboarding
const STEPS=[
  {icon:'◎',title:'Today\'s color',body:'Each day features a hand-chosen color with a reason — tied to seasons and stories.',target:'#day-banner',cardPos:{left:'50%',top:'108px',transform:'translateX(-50%)'}},
  {icon:'◈',title:'The pod',body:'Tap to breathe with it. The rings pulse with the color\'s frequency.',target:'#pod-glow',cardPos:{left:'50%',top:'178px',transform:'translateX(-50%)'}},
  {icon:'⬡',title:'Eyedropper',body:'Mix any color from the spectrum, name it, and cast it onto the pod.',target:'#tab-picker',cardPos:{left:'50%',top:'348px',transform:'translateX(-50%)'}},
  {icon:'◇',title:'Calendar',body:'Every color you journal appears on your calendar — a living record of your moods.',target:'#tab-calendar',cardPos:{left:'50%',top:'348px',transform:'translateX(-50%)'}},
  {icon:'▷',title:'Color story',body:'Press play for an audio meditation narrated to the mood of your active color.',target:'#audio-card',cardPos:{left:'50%',bottom:'80px',transform:'translateX(-50%)'}},
];
let obStep=-1,obCard=null,obDot=null;
function getRelPos(sel){
  const el=document.querySelector(sel);if(!el)return null;
  const er=el.getBoundingClientRect(),gr=root.getBoundingClientRect();
  return{x:er.left-gr.left+er.width/2,y:er.top-gr.top+er.height/2};
}
function clearOb(){if(obCard){obCard.remove();obCard=null;}if(obDot){obDot.remove();obDot=null;}}
function showStep(i){
  clearOb();const overlay=document.getElementById('onboard-overlay');
  if(i>=STEPS.length){dismissOnboard();return;}
  obStep=i;
  document.querySelectorAll('.step-dot').forEach((d,idx)=>d.classList.toggle('on',idx===i));
  const step=STEPS[i];const pos=getRelPos(step.target);
  if(pos){const dot=document.createElement('div');dot.className='onboard-dot-el';dot.style.left=pos.x+'px';dot.style.top=pos.y+'px';overlay.appendChild(dot);obDot=dot;requestAnimationFrame(()=>requestAnimationFrame(()=>dot.classList.add('visible')));}
  const card=document.createElement('div');card.className='onboard-card';Object.assign(card.style,step.cardPos);
  card.innerHTML=`<div class="onboard-icon">${step.icon}</div><div class="onboard-title">${step.title}</div><div class="onboard-body">${step.body}</div><button id="onboard-next" onclick="showStep(${i+1})">${i<STEPS.length-1?'Next →':'Done'}</button>`;
  overlay.appendChild(card);obCard=card;requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.add('visible')));
}
function dismissOnboard(){
  clearOb();const overlay=document.getElementById('onboard-overlay');
  overlay.classList.remove('active');document.getElementById('onboard-scrim').style.opacity='0';
  setTimeout(()=>{overlay.innerHTML='';},500);try{localStorage.setItem('gp_visited2','1');}catch(e){}
}
function startOnboard(){
  const overlay=document.getElementById('onboard-overlay');overlay.classList.add('active');
  const dotsEl=document.getElementById('onboard-step-dots');
  if(dotsEl)dotsEl.innerHTML=STEPS.map((_,i)=>`<div class="step-dot${i===0?' on':''}"></div>`).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{document.getElementById('onboard-scrim').style.opacity='1';}));
  setTimeout(()=>showStep(0),500);
}

// seed demo journal entries
function seedDemo(){
  if(favorites.length>0)return;
  const demos=[
    {hex:'#FFBF00',name:'Amber Skies',note:'The morning light was extraordinary today.'},
    {hex:'#7ED9C4',name:'Sea Glass Green',note:'Felt the change I\'d been resisting starting to soften.'},
    {hex:'#DA70D6',name:'Electric Orchid',note:''},
    {hex:'#4A90E2',name:'Horizon Blue',note:'Still reaching for something I can\'t quite name.'},
    {hex:'#556B2F',name:'Deep Moss',note:'Slow and grounded. Needed that.'},
    {hex:'#FF6F3C',name:'Soft Ember',note:'Remembered why I started.'},
    {hex:'#C0C0C0',name:'Lunar Silver',note:'Reflecting more than creating this week.'},
  ];
  const offsets=[0,-2,-4,-7,-10,-14,-18];
  offsets.forEach((off,i)=>{
    const d=new Date(now);d.setDate(now.getDate()+off);
    favorites.push({id:Date.now()+i,...demos[i],date:d.toLocaleDateString(),dateKey:toDateKey(d)});
  });
  try{localStorage.setItem('gp_favs2',JSON.stringify(favorites));}catch(e){}
}

seedDemo();
buildSwatches();
applyColor(true);
setDayBanner();
pickedSwatch.style.background=pickedHex;
pickedHexInput.value=pickedHex;
promptTextEl.textContent=pickPrompt();
renderFavs();
if(window.speechSynthesis)speechSynthesis.getVoices();
let fv=false;try{fv=!localStorage.getItem('gp_visited2');}catch(e){fv=true;}
if(fv)setTimeout(startOnboard,900);
